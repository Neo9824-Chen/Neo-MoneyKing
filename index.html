<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>迎财神</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #dfe7f5 0%, #eef2fa 40%, #f6e8e4 100%);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 16px;
  }
  .app {
    width: 420px; max-width: 100%;
    background: linear-gradient(180deg, #fdfdfd 0%, #f4f6fb 100%);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(40,60,120,.18);
    overflow: hidden;
  }
  /* 顶栏 */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px;
  }
  .logo {
    height: 34px; width: auto; flex-shrink: 0; display: block;
    border-radius: 8px;
  }
  .topbar h1 { font-size: 19px; color: #222; flex: 1; }
  .topbar button {
    border: 1px solid #d8dee9; background: #fff; color: #444;
    padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  .topbar button:hover { background: #f0f3fa; }
  .content { padding: 0 20px 20px; }
  .dateline { color: #8a93a6; font-size: 13px; margin-bottom: 8px; }
  .status {
    font-size: 34px; font-weight: 800; color: #2f54eb;
    letter-spacing: 2px; margin-bottom: 4px;
  }
  .offwork { color: #5b6478; font-size: 14px; margin-bottom: 12px; }
  /* 插画卡片 */
  .scene {
    position: relative;
    background: linear-gradient(180deg, #fdf6e3 0%, #fbeee0 100%);
    border-radius: 12px; padding: 8px 6px 2px;
    cursor: pointer; user-select: none;
    overflow: hidden;
  }
  .scene .hint {
    position: absolute; top: 8px; left: 12px;
    font-size: 11px; color: #b39b6d;
  }
  .scene .tips {
    position: absolute; top: 8px; right: 12px;
    font-size: 11px; color: #b39b6d;
  }
  .scene svg { width: 100%; display: block; }
  /* 木槌敲击动画（绕手腕旋转，敲在木鱼上） */
  .mallet {
    transform-box: view-box; transform-origin: 216.66px 96.74px;
    animation: malletTap 1.1s ease-in-out infinite;
  }
  @keyframes malletTap {
    0%, 100% { transform: rotate(0deg); }
    14% { transform: rotate(10deg); }
    24% { transform: rotate(-88deg); }
    34% { transform: rotate(-84deg); }
    60% { transform: rotate(0deg); }
  }
  /* 牛牛走路：身体轻起伏 + 四腿对角交替迈步 */
  .cowbody { animation: cowBob 0.9s ease-in-out infinite; }
  @keyframes cowBob {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-1.6px); }
  }
  .leg { transform-box: fill-box; transform-origin: 50% 8%; animation: trot 0.9s ease-in-out infinite; }
  @keyframes trot {
    0%, 100% { transform: rotate(10deg); }
    50% { transform: rotate(-10deg); }
  }
  .legB { animation-delay: -0.45s; }
  /* 功德+1 飘字 */
  .merit {
    position: absolute; pointer-events: none;
    font-size: 18px; font-weight: bold; color: #d4380d;
    text-shadow: 0 1px 0 #fff;
    animation: floatUp 1.4s ease-out forwards;
    white-space: nowrap; z-index: 5;
  }
  .merit.gold { color: #d48806; }
  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(6px) scale(.8); }
    15% { opacity: 1; transform: translateY(0) scale(1.1); }
    100% { opacity: 0; transform: translateY(-70px) scale(1); }
  }
  /* 功德数字 */
  .earn-label { color: #8a93a6; font-size: 13px; margin-top: 14px; }
  .earn-label em { font-style: normal; color: #b45309; }
  .merit-num {
    font-size: 46px; font-weight: 900; color: #d4380d;
    letter-spacing: 1px; line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }
  .earn-note { color: #5b6478; font-size: 13px; margin: 2px 0 12px; }
  .earn-note b { color: #d4380d; }
  /* 主按钮 */
  .focus-btn {
    width: 100%; border: none; cursor: pointer;
    background: #e5484d; color: #fff;
    font-size: 15px; padding: 12px; border-radius: 10px;
    letter-spacing: 2px;
  }
  .focus-btn:hover { background: #c73a3f; }
  /* 进度条 */
  .progress-head {
    display: flex; justify-content: space-between;
    font-size: 13px; color: #333; margin: 16px 0 6px;
  }
  .progress-head b { color: #2f54eb; }
  .bar {
    height: 10px; border-radius: 6px; background: #e6eaf3; overflow: hidden;
  }
  .bar i {
    display: block; height: 100%; border-radius: 6px;
    background: linear-gradient(90deg, #2f54eb, #597ef7);
    transition: width .5s;
  }
  .bar-note { color: #8a93a6; font-size: 12px; margin-top: 5px; }
  /* 本周累计 */
  .week { margin-top: 16px; border-top: 1px dashed #e2e6ef; padding-top: 12px; }
  .week .wk-label { color: #8a93a6; font-size: 13px; }
  .week .wk-num {
    text-align: right; font-size: 26px; font-weight: 800; color: #2f54eb;
  }
  .week .row { display: flex; justify-content: space-between; align-items: flex-end; }
  .foot-note { color: #a8b0c0; font-size: 11px; margin-top: 6px; line-height: 1.6; }
  .credit { margin-top: 12px; text-align: center; color: #b6bcc9; font-size: 11px; letter-spacing: .4px; }
  /* 上下班时间设置弹窗 */
  .modal-mask { position: fixed; inset: 0; background: rgba(20,24,38,.45); display: flex; align-items: center; justify-content: center; z-index: 99; }
  .modal { background: #fff; border-radius: 14px; padding: 20px 22px; width: 250px; box-shadow: 0 12px 40px rgba(0,0,0,.18); }
  .modal h3 { margin: 0 0 14px; font-size: 15px; color: #2b2f3a; }
  .modal label { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #555; margin-bottom: 10px; }
  .modal input[type=time] { border: 1px solid #dfe3ec; border-radius: 8px; padding: 6px 8px; font-size: 14px; color: #2b2f3a; }
  .modal-btns { display: flex; gap: 10px; margin-top: 16px; }
  .modal-btns button { flex: 1; border: none; border-radius: 8px; padding: 9px; font-size: 14px; cursor: pointer; background: #eef0f6; color: #555; }
  .modal-btns .ok { background: #e5484d; color: #fff; }
  .opt-row { display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 14px; }
  .opt-row input[type="range"] { flex: 1; }
  .opt-row .vol-label { min-width: 40px; text-align: right; font-size: 12px; color: #888; }
  /* ===== 迷你模式（类似微信视频通话小窗） ===== */
  body.minimode { padding: 0; background: #f2f4f8; }
  body.minimode .app { display: none; }
  .mini {
    display: none; width: 100%; height: 100vh;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; cursor: pointer; user-select: none; position: relative;
    background: linear-gradient(160deg, #eef2fc 0%, #fdeee9 100%);
    overflow: hidden;
  }
  body.minimode .mini { display: flex; }
  .mini .mini-art { width: 92%; display: block; }
  .mini .mini-mallet {
    transform-box: view-box; transform-origin: 31.66px 63.74px;
    animation: malletTap 1.1s ease-in-out infinite;
  }
  .mini .m-hover {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    display: none; padding: 4px 14px; border-radius: 999px;
    background: rgba(30, 36, 56, .62); color: #fff;
    font-size: 12px; font-weight: 700; letter-spacing: 2px;
    white-space: nowrap;
  }
  .mini:hover .m-hover { display: block; }
  /* ===== 桌面摆件模式（无边框透明窗口，只有财神，可拖动） ===== */
  /* 注意：不能用 -webkit-app-region: drag，它会让 hover/click 全部失效 */
  html:has(body.ornament), body.ornament {
    background: transparent; overflow: hidden;
  }
  body.ornament { padding: 0; margin: 0; }
  body.ornament .app { display: none; }
  body.ornament .mini {
    display: flex; background: transparent; cursor: grab;
  }
  body.ornament .mini:active { cursor: grabbing; }
  body.ornament .mini .mini-art {
    width: 100%;
    filter: drop-shadow(0 3px 6px rgba(60, 40, 20, .25));
  }
  body.ornament .mini .m-hover { cursor: pointer; }
</style>
</head>

    <h3>设置</h3>
    <label>上班时间 <input type="time" id="inStart" value="09:00"></label>
    <label>下班时间 <input type="time" id="inEnd" value="18:00"></label>

      <label>背景音效（自动敲击）</label>

    <div class="modal-btns">

  </div>
</div>

  let merit = parseInt(localStorage.getItem(KEY) || "0", 10);
  // 本周累计：从 0 开始，按自然周（每周一）自动清零
  const WKEY = "nmgdq_week";
  function weekId(d) {
    const s = new Date(d.getFullYear(), 0, 1);
    return d.getFullYear() + "#" + Math.floor(((d - s) / 86400000 + s.getDay()) / 7);
  }
  let week = null;
  try { week = JSON.parse(localStorage.getItem(WKEY) || "null"); } catch (e) {}
  if (!week || week.id !== weekId(new Date())) week = { id: weekId(new Date()), total: 0 };
  let autoTimer = null;
  let autoMode = false;
  const scene = document.getElementById("scene");
  const meritNum = document.getElementById("meritNum");
  const weekNum = document.getElementById("weekNum");

  let KNOCK_SRC = "muyu_knock.mp3";
  const knockAudio = new Audio(KNOCK_SRC);
  knockAudio.preload = "auto";
  knockAudio.addEventListener("error", function () {
    if (KNOCK_SRC !== KNOCK_INLINE) {
      KNOCK_SRC = KNOCK_INLINE;
      knockAudio.src = KNOCK_INLINE;
      knockAudio.load();
      knockAudio.play().catch(() => {});
    }
  });

  function render() {
    meritNum.textContent = "+" + merit.toLocaleString();
    wkToday.textContent = merit.toLocaleString();
    weekNum.textContent = week.total.toLocaleString();
    const next = 100 - (merit % 100);
    nextMilestone.textContent = next;
    localStorage.setItem(KEY, merit);
  }

  // 声音设置：vol 音量(0-100)；autoOn 自动敲击背景音效开关（手动敲击常开）
  const SKEY = "nmgdq_sound";
  let sound = { vol: 80, autoOn: true, miniAutoOn: true };
  try {
    const sv = JSON.parse(localStorage.getItem(SKEY) || "null");
    if (sv && typeof sv.vol === "number") sound = { vol: sv.vol, autoOn: sv.autoOn !== false, miniAutoOn: sv.miniAutoOn !== false };
  } catch (e) {}

  // 敲木鱼音效：优先播放真实录音，加载失败时退回 WebAudio 合成
  function knockSound() {
    if (knockAudio) {
      knockAudio.volume = sound.vol / 100;
      try { knockAudio.currentTime = 0; } catch (e) {}
      knockAudio.play().catch(() => {});
      return;
    }
    if (!audioCtx) return;
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(620, t);
    osc.frequency.exponentialRampToValueAtTime(180, t + 0.08);
    gain.gain.setValueAtTime(0.5, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.2);
    // 木质泛音
    const osc2 = audioCtx.createOscillator();
    const g2 = audioCtx.createGain();
    osc2.type = "triangle";
    osc2.frequency.setValueAtTime(1240, t);
    g2.gain.setValueAtTime(0.12, t);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    osc2.connect(g2).connect(audioCtx.destination);
    osc2.start(t); osc2.stop(t + 0.08);
  }

  function tap(x, y, fromAuto) {
    // 重启木槌敲击动画，让每一次敲击都从抬起开始
    const m = document.getElementById("malletImg");
    m.style.animation = "none";
    void m.getBoundingClientRect();
    m.style.animation = "";
    // 计数、音效、飘字统一放在木槌敲下的瞬间（约0.26s后），完全同步无时差
    // 手动与自动模式都播放音效（真实木鱼声即背景音）
    setTimeout(() => {
      merit++;
      week.total++;
      localStorage.setItem(WKEY, JSON.stringify(week));
      const inMini = document.body.classList.contains("minimode") || document.body.classList.contains("ornament");
      if (!fromAuto || (inMini ? sound.miniAutoOn : sound.autoOn)) knockSound();
      const d = document.createElement("div");
      d.className = "merit" + (merit % 100 === 0 ? " gold" : "");
      d.textContent = merit % 100 === 0 ? "财富+1 ✨殊胜✨" : "财富+1";
      const rect = scene.getBoundingClientRect();
      const px = x != null ? x - rect.left : rect.width * (0.44 + Math.random() * 0.15);
      const py = y != null ? y - rect.top : rect.height * 0.36;
      d.style.left = px + "px";
      d.style.top = py + "px";
      scene.appendChild(d);
      setTimeout(() => d.remove(), 1400);
      render();
    }, 260);
  }

  scene.addEventListener("click", (e) => tap(e.clientX, e.clientY));
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); tap(); }
  });

  // 自动念经模式
  // 状态持久化到 localStorage；窗口隐藏时暂停、显示时恢复，保证多窗口只累计一份
  const autoBtn = document.getElementById("autoBtn");
  const autoTip = document.getElementById("autoTip");
  const AKEY = "nmgdq_auto";
  let autoStored = false;
  try { autoStored = JSON.parse(localStorage.getItem(AKEY) || "false") === true; } catch (e) {}
  function startAutoLocal() {
    autoMode = true;
    // 每次敲击都会重启木槌动画（间隔与动画时长一致，节奏保持同步）
    autoTimer = setInterval(() => tap(null, null, true), 1100);
    autoBtn.textContent = "停止赚钱";
    autoTip.textContent = "自动 ▶";
  }
  function stopAutoLocal() {
    clearInterval(autoTimer); autoTimer = null; autoMode = false;
    autoBtn.textContent = "开始赚钱";
    autoTip.textContent = "自动 ⏸";
  }
  function toggleAuto() {
    autoStored = !autoStored;
    localStorage.setItem(AKEY, JSON.stringify(autoStored));
    syncAuto();
  }
  function syncAuto() {
    const should = autoStored && document.visibilityState === "visible";
    if (should && !autoTimer) startAutoLocal();
    else if (!should && autoTimer) stopAutoLocal();
  }
  document.addEventListener("visibilitychange", syncAuto);
  syncAuto();

  // 桌面摆件模式：无边框透明小窗，只显示敲木鱼的财神
  // 桌面端通过 widgetAPI 切换窗口；网页端退化为页内迷你模式
  let miniMode = false;
  function enterMini() {
    if (window.widgetAPI && window.widgetAPI.enterOrnament) { window.widgetAPI.enterOrnament(); return; }
    miniMode = true;
    document.body.classList.add("minimode");
  }
  function exitMini() {
    if (window.widgetAPI && window.widgetAPI.exitOrnament) { window.widgetAPI.exitOrnament(); return; }
    miniMode = false;
    document.body.classList.remove("minimode");
  }
  // Esc 键也可退出摆件/迷你模式
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") exitMini(); });
  // 摆件窗口（?mode=ornament）只显示透明财神
  if (location.search.indexOf("mode=ornament") >= 0) {
    document.body.classList.add("ornament");
    // 手动拖动窗口：鼠标按下/移动时把屏幕坐标发给主进程
    (function () {
      const api = window.widgetAPI;
      if (!api || !api.startOrnamentDrag) return;
      let dragging = false;
      let downPos = null;
      document.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        dragging = true;
        downPos = { x: e.screenX, y: e.screenY };
        api.startOrnamentDrag();
      });
      document.addEventListener("mousemove", (e) => {
        if (dragging) api.moveOrnamentDrag(e.screenX, e.screenY);
      });
      document.addEventListener("mouseup", (e) => {
        if (!dragging) return;
        dragging = false;
        // 原地松手（几乎没移动）= 点击：恢复主窗口（胶囊按钮的 click 也会触发 exitMini，二选一即可）
        if (downPos && Math.abs(e.screenX - downPos.x) < 4 && Math.abs(e.screenY - downPos.y) < 4) exitMini();
      });
    })();
  }

  // 设置弹窗：上下班时间 + 声音（音量 / 自动敲击背景音效开关），确定后全局同步生效
  const TKEY = "nmgdq_times";
  function getTimes() {
    try {
      const s = JSON.parse(localStorage.getItem(TKEY) || "null");
      if (s && s.s && s.e) return s;
    } catch (e) {}
    return { s: "09:00", e: "18:00" };
  }
  function openTimeModal() {
    const t = getTimes();
    document.getElementById("inStart").value = t.s;
    document.getElementById("inEnd").value = t.e;
    document.getElementById("inAutoSound").checked = sound.autoOn;
    document.getElementById("inMiniSound").checked = sound.miniAutoOn !== false;
    const vr = document.getElementById("inVolume");
    vr.value = sound.vol;
    document.getElementById("volVal").textContent = sound.vol + "%";
    soundSnapshot = { vol: sound.vol, autoOn: sound.autoOn, miniAutoOn: sound.miniAutoOn };
    document.getElementById("timeModal").style.display = "flex";
  }
  // 音量/背景音效开关实时生效（拖动立即变声，不用等「确定」）
  let soundSnapshot = null;
  function applySoundLive() {
    if (knockAudio) knockAudio.volume = sound.vol / 100;
    localStorage.setItem(SKEY, JSON.stringify(sound));
  }
  document.addEventListener("input", (e) => {
    if (e.target && e.target.id === "inVolume") {
      document.getElementById("volVal").textContent = e.target.value + "%";
      sound.vol = parseInt(e.target.value, 10) || 0;
      applySoundLive();
    }
  });
  document.addEventListener("change", (e) => {
    if (e.target && e.target.id === "inAutoSound") {
      sound.autoOn = e.target.checked;
      applySoundLive();
    }
    if (e.target && e.target.id === "inMiniSound") {
      sound.miniAutoOn = e.target.checked;
      applySoundLive();
    }
  });
  function closeTimeModal() {
    soundSnapshot = null;
    document.getElementById("timeModal").style.display = "none";
  }
  // 取消：撤销本次实时改动，恢复打开弹窗时的设置
  function cancelTimeModal() {
    if (soundSnapshot) {
      sound = soundSnapshot;
      soundSnapshot = null;
      localStorage.setItem(SKEY, JSON.stringify(sound));
      if (knockAudio) knockAudio.volume = sound.vol / 100;
    }
    document.getElementById("timeModal").style.display = "none";
  }
  function saveTimes() {
    const s = document.getElementById("inStart").value || "09:00";
    const e = document.getElementById("inEnd").value || "18:00";
    localStorage.setItem(TKEY, JSON.stringify({ s, e }));
    sound = {
      vol: parseInt(document.getElementById("inVolume").value, 10) || 0,
      autoOn: document.getElementById("inAutoSound").checked,
      miniAutoOn: document.getElementById("inMiniSound").checked
    };
    localStorage.setItem(SKEY, JSON.stringify(sound));
    closeTimeModal();
    tick();
  }

  // 时钟 / 下班倒计时 / 工时进度
  const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];
  function tick() {
    const now = new Date();
    const pad = n => String(n).padStart(2, "0");
    const dateStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${WEEK[now.getDay()]} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    document.getElementById("dateline").textContent = dateStr;
    // 上下班时间：读取设置弹窗保存的值（默认 9:00-18:00），支持跨零点
    const t = getTimes();
    const [sh, sm] = t.s.split(":").map(Number);
    const [eh, em] = t.e.split(":").map(Number);
    const start = new Date(now); start.setHours(sh, sm, 0, 0);
    const off = new Date(now); off.setHours(eh, em, 0, 0);
    if (off <= start) off.setDate(off.getDate() + 1);
    let diff = off - now;
    if (diff < 0) diff = 0;
    const h = Math.floor(diff / 3600000), m = Math.floor(diff % 3600000 / 60000), s = Math.floor(diff % 60000 / 1000);
    document.getElementById("offwork").textContent = `${h}小时${m}分${s}秒`;
    const total = off - start;
    let pct = Math.min(100, Math.max(0, (now - start) / total * 100));
    if (now < start) pct = 0;
    const spanH = total / 3600000;
    const worked = (pct / 100 * spanH).toFixed(2);
    document.getElementById("progPct").textContent = pct.toFixed(1) + "%";
    document.getElementById("progBar").style.width = pct + "%";
    document.getElementById("progDetail").textContent = `已工时 ${worked}/${spanH.toFixed(2)}小时`;
    document.querySelector(".bar-note").textContent = `上班 ${t.s} · 下班 ${t.e} 自动计算，敲鱼不误砍柴工`;
  }
  setInterval(tick, 1000); tick();
  render();
</script>

  (function () {
    document.querySelectorAll("[data-inline]").forEach(function (el) {
      const inline = INLINE_IMG[el.getAttribute("data-inline")];
      if (!inline) return;
      const url = el.getAttribute("src") || el.getAttribute("href");
      const probe = new Image();
      probe.onerror = function () {
        if (el.tagName.toLowerCase() === "image") el.setAttribute("href", inline);
        else el.setAttribute("src", inline);
      };
      probe.src = url;
    });
  })();
